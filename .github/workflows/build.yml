name: Compile solution

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore LitheEcs.sln

      - name: Build solution
        run: dotnet build LitheEcs.sln --configuration Release --no-restore

      - name: Test solution
        run: dotnet test LitheEcs.sln --configuration Release --no-build --no-restore
